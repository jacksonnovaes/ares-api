spring:
  application:
    name: ares-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

ares:
  features:
    subscription-payment-simulation-enabled: ${SUBSCRIPTION_PAYMENT_SIMULATION_ENABLED:false}
  legal:
    terms-version: ${LEGAL_TERMS_VERSION:2026-08-27}
    privacy-version: ${LEGAL_PRIVACY_VERSION:2026-08-27}
  promotions:
    coupon-code: ${PROMOTION_COUPON_CODE:}
    discount-percentage: ${PROMOTION_DISCOUNT_PERCENTAGE:0}
    valid-until: ${PROMOTION_VALID_UNTIL:}
  security:
    issuer: ${JWT_ISSUER:ares-api}
    secret-base64: ${JWT_SECRET_BASE64}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    password-reset-ttl: ${PASSWORD_RESET_TTL:PT30M}
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window: ${LOGIN_FAILURE_WINDOW:PT15M}
      block-duration: ${LOGIN_BLOCK_DURATION:PT15M}

logging:
  level:
    org.springframework.security: INFO
