spring:
  application:
    name: ares-api
  datasource:
    url: ${DB_URL:postgres://postgres:J1ck50nb#J1ck50nb@ares_aresdb:5432/ares?sslmode=disable}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

ares:
  features:
    subscription-payment-simulation-enabled: ${SUBSCRIPTION_PAYMENT_SIMULATION_ENABLED:true}
  legal:
    terms-version: ${LEGAL_TERMS_VERSION:2026-08-27}
    privacy-version: ${LEGAL_PRIVACY_VERSION:2026-08-27}
  promotions:
    coupon-code: ${PROMOTION_COUPON_CODE:}
    discount-percentage: ${PROMOTION_DISCOUNT_PERCENTAGE:0}
    valid-until: ${PROMOTION_VALID_UNTIL:}
  security:
    issuer: ${JWT_ISSUER:ares-api}
    secret-base64: ${JWT_SECRET_BASE64:VGhpcy1pcy1hLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtaXQtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    password-reset-ttl: ${PASSWORD_RESET_TTL:PT30M}
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window: ${LOGIN_FAILURE_WINDOW:PT15M}
      block-duration: ${LOGIN_BLOCK_DURATION:PT15M}

logging:
  level:
    org.springframework.security: INFO
