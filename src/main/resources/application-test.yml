spring:
  datasource:
    url: jdbc:h2:mem:ares;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    # As migrations usam recursos específicos do PostgreSQL. No profile test,
    # o schema efêmero é criado diretamente a partir das entidades JPA.
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

ares:
  features:
    subscription-payment-simulation-enabled: true
  legal:
    terms-version: 2026-08-27
    privacy-version: 2026-08-27
  promotions:
    coupon-code: BEMVINDO20
    discount-percentage: 20
    valid-until: 2099-12-31
  security:
    issuer: ares-test
    secret-base64: ${JWT_SECRET_BASE64:VGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWFiY2RlZg==}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    password-reset-ttl: PT30M
    login:
      max-failures: 5
      window: PT15M
      block-duration: PT15M

logging:
  level:
    org.springframework.security: INFO
