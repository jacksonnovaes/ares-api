services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ares}
      POSTGRES_USER: ${POSTGRES_USER:-ares}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ares}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ares-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ares}
      DB_USERNAME: ${POSTGRES_USER:-ares}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ares}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VGhpcy1pcy1hLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtaXQtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  api-test:
    profiles: ["test"]
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-VGhpcy1pcy1hLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtaXQtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
    ports:
      - "${TEST_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  ares-postgres-data:
